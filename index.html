<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Journey · Bella Cucina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --text: #1D1D1F;
    --text-2: #6E6E73;
    --text-3: #86868B;
    --line: #D2D2D7;
    --line-faint: #F0F0F2;

    --live: #2F7D4A;
    --paused: #B07A2E;

    /* Branch palettes — each branch carries its own tint */
    --c-root-bg: #F1EDE3;
    --c-root-text: #2A2218;
    --c-root-line: #B0A88B;

    --c-lead-bg: #F4DDC2;
    --c-lead-text: #6B4A30;
    --c-lead-line: #C9A77B;
    --c-lead-child: #FAEBD6;

    --c-new-bg: #D9E5D9;
    --c-new-text: #3D5A3D;
    --c-new-line: #8FAE8F;
    --c-new-child: #ECF2EC;

    --c-active-bg: #CCD8E5;
    --c-active-text: #3D506A;
    --c-active-line: #809AB8;
    --c-active-child: #E1E8F0;

    --c-vip-bg: #E5D6B5;
    --c-vip-text: #6E5430;
    --c-vip-line: #BFA372;
    --c-vip-child: #F2E8D2;

    --c-atrisk-bg: #E8C9BC;
    --c-atrisk-text: #7A4A3A;
    --c-atrisk-line: #BA8770;
    --c-atrisk-child: #F2DED5;

    --c-cold-bg: #D6D5DE;
    --c-cold-text: #4A4A5A;
    --c-cold-line: #9D9DAE;
    --c-cold-child: #E8E8EE;

    --c-prefs-bg: #DDD5E8;
    --c-prefs-text: #4F4670;
    --c-prefs-line: #A398BD;
    --c-prefs-child: #ECE6F2;

    --c-triggers-bg: #C8DDDD;
    --c-triggers-text: #2F5A5A;
    --c-triggers-line: #6FA8A8;
    --c-triggers-child: #DEEDED;

    --c-editorial-bg: #ECE2C8;
    --c-editorial-text: #6E5E30;
    --c-editorial-line: #BFA972;
    --c-editorial-child: #F4ECD8;

    --c-platform-bg: #E8D2D2;
    --c-platform-text: #6B3F3F;
    --c-platform-line: #C39898;
    --c-platform-child: #F2E2E2;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", system-ui, sans-serif;
    font-weight: 400;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow: hidden; /* No page scroll — canvas handles its own */
  }

  /* ───────── PAGE FRAME ───────── */
  .page {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    padding: 28px 48px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--line-faint);
    flex-shrink: 0;
  }
  .topbar .brand {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.005em;
    color: var(--text);
  }
  .topbar .meta {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--text-3);
    font-weight: 500;
  }

  /* ───────── CANVAS ───────── */
  .canvas-wrap {
    flex: 1;
    overflow: hidden; /* Figma-style: no native scroll, pan via translate */
    position: relative;
    cursor: grab;
  }
  .canvas-wrap.panning {
    cursor: grabbing;
    user-select: none;
    -webkit-user-select: none;
  }
  .canvas-wrap.panning .mm-node,
  .canvas-wrap.panning * {
    cursor: grabbing !important;
  }
  .canvas {
    min-width: 100%;
    min-height: 100%;
    padding: 80px;
    display: flex;
    justify-content: safe center;
    align-items: safe center;
  }

  /* Zoom + pan wrapper — transform set entirely from JS */
  .zoom-content {
    position: relative;
    transform-origin: center center;
    will-change: transform;
  }
  .zoom-content.animating {
    transition: transform 0.4s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  /* SVG layer for connection lines */
  .lines {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 1;
  }
  .mm-line {
    fill: none;
    stroke-width: 1.5;
    stroke-linecap: round;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .mm-line.show { opacity: 0.55; }
  .mm-line-root { stroke: var(--c-root-line); }
  .mm-line-lead { stroke: var(--c-lead-line); }
  .mm-line-new { stroke: var(--c-new-line); }
  .mm-line-active { stroke: var(--c-active-line); }
  .mm-line-vip { stroke: var(--c-vip-line); }
  .mm-line-atrisk { stroke: var(--c-atrisk-line); }
  .mm-line-cold { stroke: var(--c-cold-line); }
  .mm-line-prefs { stroke: var(--c-prefs-line); }
  .mm-line-triggers { stroke: var(--c-triggers-line); }
  .mm-line-editorial { stroke: var(--c-editorial-line); }
  .mm-line-platform { stroke: var(--c-platform-line); }

  /* ───────── TREE LAYOUT ───────── */
  .tree {
    position: relative;
    z-index: 2;
    display: inline-block;
  }

  .mm-branch {
    display: flex;
    align-items: center;
    position: relative;
  }
  .mm-children {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-left: 90px;
    align-items: flex-start;
  }
  .mm-children > .mm-branch {
    animation: branchIn 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) both;
    animation-delay: var(--stagger, 0ms);
  }

  @keyframes branchIn {
    from {
      opacity: 0;
      transform: translateX(-20px);
    }
    to {
      opacity: 1;
      transform: translateX(0);
    }
  }

  /* ───────── NODE ───────── */
  .mm-node {
    background: var(--node-bg, var(--c-root-bg));
    color: var(--node-text, var(--c-root-text));
    border-radius: 100px;
    padding: 12px 18px 12px 18px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: -0.005em;
    border: none;
    transition: transform 0.25s cubic-bezier(0.22, 0.61, 0.36, 1),
                box-shadow 0.25s ease;
    white-space: nowrap;
    flex-shrink: 0;
    user-select: none;
    position: relative;
  }
  .mm-node:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(29, 29, 31, 0.06);
  }
  .mm-node.expanded {
    box-shadow: 0 2px 8px rgba(29, 29, 31, 0.05);
  }

  /* Root node treatment — larger, more presence */
  .mm-node.mm-root {
    padding: 18px 26px 18px 28px;
    font-size: 16px;
    font-weight: 600;
    background: var(--c-root-bg);
    color: var(--c-root-text);
  }
  .mm-node.mm-root .mm-arrow {
    font-size: 16px;
  }
  .mm-node.mm-root .mm-sub {
    color: var(--c-root-text);
    opacity: 0.65;
  }

  .mm-label {
    display: inline-flex;
    flex-direction: column;
    gap: 2px;
    line-height: 1.2;
  }
  .mm-sub {
    font-size: 10px;
    font-weight: 500;
    opacity: 0.7;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    line-height: 1.2;
  }

  .mm-status {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .mm-status.live { background: var(--live); }
  .mm-status.paused { background: var(--paused); }
  .mm-status.partial {
    background: var(--live);
    box-shadow: 0 0 0 2px rgba(47, 125, 74, 0.18);
  }

  .mm-arrow {
    font-size: 13px;
    font-weight: 600;
    opacity: 0.55;
    transition: transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
    line-height: 1;
  }
  .mm-node.expanded .mm-arrow {
    transform: rotate(90deg);
  }
  .mm-node:hover .mm-arrow {
    opacity: 1;
  }
  .mm-node.leaf .mm-arrow {
    font-size: 11px;
    opacity: 0.4;
  }

  /* Selected leaf — has open note */
  .mm-node.note-open {
    box-shadow: 0 0 0 2px var(--node-text, var(--c-root-text)),
                0 4px 14px rgba(29, 29, 31, 0.08);
  }

  /* ───────── BRANCH COLOR ASSIGNMENTS ───────── */
  .mm-node.b-lead { --node-bg: var(--c-lead-bg); --node-text: var(--c-lead-text); }
  .mm-node.b-new { --node-bg: var(--c-new-bg); --node-text: var(--c-new-text); }
  .mm-node.b-active { --node-bg: var(--c-active-bg); --node-text: var(--c-active-text); }
  .mm-node.b-vip { --node-bg: var(--c-vip-bg); --node-text: var(--c-vip-text); }
  .mm-node.b-atrisk { --node-bg: var(--c-atrisk-bg); --node-text: var(--c-atrisk-text); }
  .mm-node.b-cold { --node-bg: var(--c-cold-bg); --node-text: var(--c-cold-text); }
  .mm-node.b-prefs { --node-bg: var(--c-prefs-bg); --node-text: var(--c-prefs-text); }
  .mm-node.b-triggers { --node-bg: var(--c-triggers-bg); --node-text: var(--c-triggers-text); }
  .mm-node.b-editorial { --node-bg: var(--c-editorial-bg); --node-text: var(--c-editorial-text); }
  .mm-node.b-platform { --node-bg: var(--c-platform-bg); --node-text: var(--c-platform-text); }

  /* Children use lighter shade */
  .mm-node.child-lead { --node-bg: var(--c-lead-child); --node-text: var(--c-lead-text); }
  .mm-node.child-new { --node-bg: var(--c-new-child); --node-text: var(--c-new-text); }
  .mm-node.child-active { --node-bg: var(--c-active-child); --node-text: var(--c-active-text); }
  .mm-node.child-vip { --node-bg: var(--c-vip-child); --node-text: var(--c-vip-text); }
  .mm-node.child-atrisk { --node-bg: var(--c-atrisk-child); --node-text: var(--c-atrisk-text); }
  .mm-node.child-cold { --node-bg: var(--c-cold-child); --node-text: var(--c-cold-text); }
  .mm-node.child-prefs { --node-bg: var(--c-prefs-child); --node-text: var(--c-prefs-text); }
  .mm-node.child-triggers { --node-bg: var(--c-triggers-child); --node-text: var(--c-triggers-text); }
  .mm-node.child-editorial { --node-bg: var(--c-editorial-child); --node-text: var(--c-editorial-text); }
  .mm-node.child-platform { --node-bg: var(--c-platform-child); --node-text: var(--c-platform-text); }

  /* ───────── STICKY NOTE ───────── */
  .note {
    position: fixed;
    z-index: 100;
    width: 320px;
    background: var(--bg);
    border-radius: 14px;
    box-shadow:
      0 0 0 1px rgba(29, 29, 31, 0.06),
      0 12px 36px rgba(29, 29, 31, 0.14),
      0 4px 12px rgba(29, 29, 31, 0.06);
    padding: 24px 24px 22px;
    opacity: 0;
    transform: translateX(-12px) scale(0.96);
    transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.22, 0.61, 0.36, 1);
    pointer-events: none;
  }
  .note.open {
    opacity: 1;
    transform: translateX(0) scale(1);
    pointer-events: auto;
  }

  .note-close {
    position: absolute;
    top: 14px;
    right: 14px;
    background: transparent;
    border: none;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    cursor: pointer;
    color: var(--text-3);
    font-size: 16px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }
  .note-close:hover {
    background: var(--line-faint);
    color: var(--text);
  }

  .note-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 100px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    margin-bottom: 14px;
  }
  .note-status.live { background: #E8F3EC; color: var(--live); }
  .note-status.paused { background: #FBF1E2; color: var(--paused); }
  .note-status.planned { background: var(--line-faint); color: var(--text-2); }
  .note-status::before {
    content: "●";
    font-size: 8px;
  }

  .note-title {
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.25;
    color: var(--text);
    margin-bottom: 18px;
  }

  .note-details {
    display: grid;
    grid-template-columns: 70px 1fr;
    gap: 10px 14px;
    margin-bottom: 16px;
  }
  .note-details dt {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-3);
    font-weight: 600;
    padding-top: 1px;
  }
  .note-details dd {
    font-size: 13px;
    color: var(--text);
    line-height: 1.45;
  }

  .note-text {
    font-size: 13px;
    color: var(--text-2);
    line-height: 1.5;
    padding-top: 14px;
    border-top: 1px solid var(--line-faint);
    font-style: italic;
  }

  /* ───────── HINT ───────── */
  .start-hint {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
    pointer-events: none;
    opacity: 1;
    transition: opacity 0.4s ease;
  }
  .start-hint.hidden { opacity: 0; }
  .start-hint .pulse {
    display: inline-block;
    margin-right: 6px;
    color: var(--c-lead-text);
    animation: pulseDot 1.6s ease-in-out infinite;
  }
  @keyframes pulseDot {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 1; }
  }

  /* ───────── ZOOM CONTROLS ───────── */
  .zoom-controls {
    position: fixed;
    bottom: 28px;
    left: 32px;
    display: flex;
    align-items: center;
    gap: 2px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 6px;
    border-radius: 100px;
    border: 1px solid var(--line-faint);
    z-index: 50;
  }
  .zoom-btn {
    background: transparent;
    border: none;
    cursor: pointer;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    font-size: 16px;
    font-weight: 500;
    font-family: inherit;
    transition: background 0.15s ease;
    line-height: 1;
    padding: 0;
  }
  .zoom-btn:hover {
    background: var(--line-faint);
  }
  .zoom-btn:active {
    background: var(--line);
  }
  .zoom-btn.fit {
    font-size: 14px;
  }
  .zoom-level {
    background: transparent;
    border: none;
    cursor: pointer;
    min-width: 56px;
    height: 32px;
    padding: 0 10px;
    border-radius: 16px;
    color: var(--text-2);
    font-size: 11px;
    font-weight: 600;
    font-family: inherit;
    letter-spacing: 0.04em;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .zoom-level:hover {
    background: var(--line-faint);
    color: var(--text);
  }

  /* ───────── LEGEND (small, fixed corner) ───────── */
  .legend {
    position: fixed;
    bottom: 28px;
    right: 32px;
    display: flex;
    gap: 18px;
    background: rgba(255, 255, 255, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 10px 16px;
    border-radius: 100px;
    border: 1px solid var(--line-faint);
    z-index: 50;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--text-2);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
  }
  .legend-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }
  .legend-dot.live { background: var(--live); }
  .legend-dot.paused { background: var(--paused); }
  .legend-dot.planned {
    background: transparent;
    border: 1px solid var(--text-3);
  }

  /* ───────── RESPONSIVE ───────── */
  @media (max-width: 768px) {
    .topbar { padding: 20px 24px; }
    .canvas { padding: 40px 30px; }
    .mm-children { margin-left: 50px; gap: 10px; }
    .mm-node { font-size: 12.5px; padding: 10px 14px; }
    .legend { display: none; }
  }
</style>
</head>
<body>

<div class="page">

  <!-- Minimal top bar -->
  <div class="topbar">
    <span class="brand">Bella Cucina</span>
    <span class="meta">Customer Journey · 2026</span>
  </div>

  <!-- Mindmap canvas -->
  <div class="canvas-wrap" id="canvas-wrap">
    <div class="canvas" id="canvas">
      <div class="zoom-content" id="zoom-content">
        <svg class="lines" id="lines"></svg>
        <div class="tree" id="tree"></div>
      </div>
    </div>
  </div>

  <!-- Sticky note (positioned dynamically) -->
  <div class="note" id="note"></div>

  <!-- Start hint -->
  <div class="start-hint" id="hint">
    <span class="pulse">●</span>Click the root to begin
  </div>

  <!-- Zoom controls -->
  <div class="zoom-controls">
    <button class="zoom-btn" id="zoom-out" aria-label="Zoom out" title="Zoom out (−)">−</button>
    <button class="zoom-level" id="zoom-reset" aria-label="Reset zoom to 100%" title="Reset zoom (0)">100%</button>
    <button class="zoom-btn" id="zoom-in" aria-label="Zoom in" title="Zoom in (+)">+</button>
    <button class="zoom-btn fit" id="zoom-fit" aria-label="Fit to screen" title="Fit all (F)">⤢</button>
  </div>

  <!-- Legend -->
  <div class="legend">
    <div class="legend-item"><span class="legend-dot live"></span>Live</div>
    <div class="legend-item"><span class="legend-dot paused"></span>Paused</div>
    <div class="legend-item"><span class="legend-dot planned"></span>Planned</div>
  </div>

</div>

    'leads-5': { label: '3 Weeks · Welcome code expiration', color: 'lead', status: 'live', isLeaf: true,

  // ═══════════════ STATE ═══════════════
  const state = {
    expanded: new Set(),
    openNote: null,
    zoom: 1.0,
    pan: { x: 0, y: 0 }
  };

  // ═══════════════ DOM ═══════════════
  const treeEl = document.getElementById('tree');
  const svg = document.getElementById('lines');
  const noteEl = document.getElementById('note');
  const canvas = document.getElementById('canvas');
  const canvasWrap = document.getElementById('canvas-wrap');
  const zoomContent = document.getElementById('zoom-content');
  const hintEl = document.getElementById('hint');
  const zoomLevelEl = document.getElementById('zoom-reset');

  // ═══════════════ RENDER ═══════════════
  function render() {
    treeEl.innerHTML = '';
    renderBranch('root', treeEl, 0);
    requestAnimationFrame(() => {
      drawLines();
    });
  }

  function renderBranch(id, container, depth) {
    const nodeData = data[id];
    if (!nodeData) return;

    const branchEl = document.createElement('div');
    branchEl.className = 'mm-branch';

    const nodeEl = createNode(id, nodeData, depth);
    branchEl.appendChild(nodeEl);

    if (state.expanded.has(id) && nodeData.children && nodeData.children.length) {
      const childrenEl = document.createElement('div');
      childrenEl.className = 'mm-children';
      childrenEl.dataset.parentId = id;
      nodeData.children.forEach((childId, i) => {
        const childBranch = renderBranch(childId, childrenEl, depth + 1);
      });
      branchEl.appendChild(childrenEl);
      // Stagger animation on children
      [...childrenEl.children].forEach((child, i) => {
        child.style.setProperty('--stagger', `${i * 50}ms`);
      });
    }

    container.appendChild(branchEl);
    return branchEl;
  }

  function createNode(id, nodeData, depth) {
    const el = document.createElement('button');
    el.className = 'mm-node';
    el.dataset.id = id;

    // Apply color class
    if (depth === 0) {
      el.classList.add('mm-root');
    } else if (nodeData.isLeaf) {
      el.classList.add('leaf');
      el.classList.add(`child-${nodeData.color}`);
    } else {
      el.classList.add(`b-${nodeData.color}`);
    }

    if (state.expanded.has(id)) {
      el.classList.add('expanded');
    }

    // Status dot
    let statusHtml = '';
    if (nodeData.status === 'live') {
      statusHtml = '<span class="mm-status live" title="Live"></span>';
    } else if (nodeData.status === 'paused') {
      statusHtml = '<span class="mm-status paused" title="Paused"></span>';
    } else if (nodeData.status === 'partial') {
      statusHtml = '<span class="mm-status partial" title="Partially live"></span>';
    }

    // Label content
    const labelHtml = nodeData.sub
      ? `<span class="mm-label"><span>${nodeData.label}</span><span class="mm-sub">${nodeData.sub}</span></span>`
      : `<span class="mm-label">${nodeData.label}</span>`;

    // Arrow indicator
    const arrowHtml = nodeData.isLeaf
      ? '<span class="mm-arrow">›</span>'
      : '<span class="mm-arrow">›</span>';

    el.innerHTML = statusHtml + labelHtml + arrowHtml;

    return el;
  }

  // ═══════════════ LINES ═══════════════
  function drawLines() {
    svg.innerHTML = '';
    // Size SVG to match tree's unscaled bounds
    const treeW = treeEl.offsetWidth;
    const treeH = treeEl.offsetHeight;
    svg.setAttribute('width', treeW);
    svg.setAttribute('height', treeH);
    svg.setAttribute('viewBox', `0 0 ${treeW} ${treeH}`);
    svg.style.width = treeW + 'px';
    svg.style.height = treeH + 'px';

    // Compute tree's offset within zoom-content so line coordinates align
    const treeOffsetLeft = treeEl.offsetLeft;
    const treeOffsetTop = treeEl.offsetTop;
    svg.style.left = treeOffsetLeft + 'px';
    svg.style.top = treeOffsetTop + 'px';

    state.expanded.forEach(parentId => {
      const parentEl = canvas.querySelector(`.mm-node[data-id="${parentId}"]`);
      const childrenContainer = canvas.querySelector(`.mm-children[data-parent-id="${parentId}"]`);
      if (!parentEl || !childrenContainer) return;

      const children = childrenContainer.querySelectorAll(':scope > .mm-branch > .mm-node');

      children.forEach((childEl, i) => {
        // Use offsetLeft/offsetTop chain — gives unscaled positions inside zoom-content
        const p = getNodeOffsetWithinTree(parentEl);
        const c = getNodeOffsetWithinTree(childEl);
        const x1 = p.left + parentEl.offsetWidth;
        const y1 = p.top + parentEl.offsetHeight / 2;
        const x2 = c.left;
        const y2 = c.top + childEl.offsetHeight / 2;

        const dx = x2 - x1;
        const cx1 = x1 + dx * 0.55;
        const cx2 = x2 - dx * 0.55;
        const d = `M ${x1} ${y1} C ${cx1} ${y1}, ${cx2} ${y2}, ${x2} ${y2}`;

        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        const parentColor = data[parentId].color || 'root';
        path.setAttribute('class', `mm-line mm-line-${parentColor}`);
        svg.appendChild(path);

        try {
          const length = path.getTotalLength();
          path.style.strokeDasharray = length;
          path.style.strokeDashoffset = length;
          requestAnimationFrame(() => {
            path.style.transition = `stroke-dashoffset 0.5s cubic-bezier(0.22, 0.61, 0.36, 1) ${i * 50}ms`;
            path.style.strokeDashoffset = '0';
            setTimeout(() => path.classList.add('show'), i * 50);
          });
        } catch (e) {
          path.classList.add('show');
        }
      });
    });
  }

  // Walk offsetParent chain to get a node's position within the tree
  function getNodeOffsetWithinTree(el) {
    let left = 0, top = 0;
    let current = el;
    while (current && current !== treeEl) {
      left += current.offsetLeft;
      top += current.offsetTop;
      current = current.offsetParent;
      if (current === treeEl.offsetParent) break;
    }
    return { left, top };
  }

  // ═══════════════ INTERACTION ═══════════════
  function toggleExpand(id) {
    if (state.expanded.has(id)) {
      collapseRecursive(id);
    } else {
      state.expanded.add(id);
    }
    closeNote();
    hideHint();
    render();
  }

  function collapseRecursive(id) {
    state.expanded.delete(id);
    const nodeData = data[id];
    if (nodeData && nodeData.children) {
      nodeData.children.forEach(childId => {
        if (state.expanded.has(childId)) {
          collapseRecursive(childId);
        }
      });
    }
  }

  function openNote(id, nodeEl) {
    const nodeData = data[id];
    if (!nodeData || !nodeData.isLeaf) return;

    // Clear previous selection
    document.querySelectorAll('.mm-node.note-open').forEach(n => n.classList.remove('note-open'));
    nodeEl.classList.add('note-open');

    const statusLabel = nodeData.status === 'live' ? 'Live'
                      : nodeData.status === 'paused' ? 'Paused'
                      : 'Planned';

    noteEl.innerHTML = `
      <button class="note-close" aria-label="Close">×</button>
      <span class="note-status ${nodeData.status}">${statusLabel}</span>
      <h3 class="note-title">${nodeData.label}</h3>
      <dl class="note-details">
        <dt>When</dt><dd>${nodeData.when}</dd>
        <dt>Sends</dt><dd>${nodeData.what}</dd>
        <dt>Platform</dt><dd>${nodeData.plat}</dd>
      </dl>
      ${nodeData.note ? `<p class="note-text">${nodeData.note}</p>` : ''}
    `;

    // Position next to node
    positionNote(nodeEl);
    requestAnimationFrame(() => noteEl.classList.add('open'));
    state.openNote = id;

    // Close button
    noteEl.querySelector('.note-close').addEventListener('click', (e) => {
      e.stopPropagation();
      closeNote();
    });
  }

  function positionNote(nodeEl) {
    const rect = nodeEl.getBoundingClientRect();
    const noteWidth = 320;
    const margin = 24;
    let left = rect.right + margin;
    let top = rect.top;

    // If would overflow right, position to left of node
    if (left + noteWidth > window.innerWidth - 24) {
      left = rect.left - noteWidth - margin;
    }
    // If still bad, fall back to centered
    if (left < 24) {
      left = Math.max(24, rect.left);
    }
    // If would overflow bottom, shift up
    const noteHeight = 280;
    if (top + noteHeight > window.innerHeight - 24) {
      top = window.innerHeight - noteHeight - 24;
    }
    if (top < 24) top = 24;

    noteEl.style.left = left + 'px';
    noteEl.style.top = top + 'px';
  }

  function closeNote() {
    noteEl.classList.remove('open');
    document.querySelectorAll('.mm-node.note-open').forEach(n => n.classList.remove('note-open'));
    state.openNote = null;
  }

  function hideHint() {
    hintEl.classList.add('hidden');
  }

  // Event delegation for node clicks
  treeEl.addEventListener('click', (e) => {
    // If the user dragged, swallow this click — they panned, didn't click
    if (didDrag) {
      didDrag = false;
      return;
    }
    const node = e.target.closest('.mm-node');
    if (!node) return;
    e.stopPropagation();
    const id = node.dataset.id;
    const nodeData = data[id];
    if (!nodeData) return;

    if (nodeData.isLeaf) {
      // Toggle the note: if already open for this leaf, close it
      if (state.openNote === id) {
        closeNote();
      } else {
        openNote(id, node);
      }
      hideHint();
    } else {
      toggleExpand(id);
    }
  });

  // Click outside to close note (also respects drag)
  document.addEventListener('click', (e) => {
    if (didDrag) return; // don't treat the end of a pan as a click
    if (e.target.closest('.note') || e.target.closest('.mm-node')) return;
    closeNote();
  });

  // Escape to close, plus zoom shortcuts
  document.addEventListener('keydown', (e) => {
    // Ignore if user is typing in a field (defensive)
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    if (e.key === 'Escape') {
      if (state.openNote) closeNote();
      return;
    }
    if (e.key === '+' || e.key === '=') {
      e.preventDefault();
      zoomIn();
    } else if (e.key === '-' || e.key === '_') {
      e.preventDefault();
      zoomOut();
    } else if (e.key === '0') {
      e.preventDefault();
      zoomReset();
    } else if (e.key === 'f' || e.key === 'F') {
      e.preventDefault();
      fitToScreen();
    }
  });

  // ═══════════════ PAN + ZOOM (Figma-style translate-based) ═══════════════
  const PAN_THRESHOLD = 5; // pixels of movement before a click becomes a drag
  const ZOOM_MIN = 0.3;
  const ZOOM_MAX = 2.0;
  const ZOOM_STEP = 0.1;
  let panState = null;
  let didDrag = false;

  // Single source of truth: apply translate + scale together
  function applyTransform(animate) {
    zoomContent.classList.toggle('animating', !!animate);
    zoomContent.style.transform =
      `translate(${state.pan.x}px, ${state.pan.y}px) scale(${state.zoom})`;
  }

  function setZoom(newZoom, animate = true) {
    const clamped = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));
    state.zoom = Math.round(clamped * 100) / 100;
    applyTransform(animate);
    zoomLevelEl.textContent = Math.round(state.zoom * 100) + '%';
    if (state.openNote) {
      setTimeout(() => {
        const nodeEl = canvas.querySelector(`.mm-node[data-id="${state.openNote}"]`);
        if (nodeEl) positionNote(nodeEl);
      }, animate ? 420 : 20);
    }
  }

  function setPan(x, y, animate = false) {
    state.pan = { x, y };
    applyTransform(animate);
  }

  function zoomIn() { setZoom(state.zoom + ZOOM_STEP); }
  function zoomOut() { setZoom(state.zoom - ZOOM_STEP); }
  function zoomReset() {
    setPan(0, 0, true);
    setZoom(1.0, true);
  }

  function fitToScreen() {
    // Reset pan first so the content centers cleanly
    setPan(0, 0, false);
    const previousZoom = state.zoom;
    setZoom(1.0, false);
    requestAnimationFrame(() => {
      const viewport = canvasWrap.getBoundingClientRect();
      const w = zoomContent.offsetWidth;
      const h = zoomContent.offsetHeight;
      if (w === 0 || h === 0) {
        setZoom(previousZoom, false);
        return;
      }
      const padding = 120;
      const scaleX = (viewport.width - padding) / w;
      const scaleY = (viewport.height - padding) / h;
      const scale = Math.min(scaleX, scaleY, 1.2);
      setZoom(Math.max(ZOOM_MIN, scale), true);
    });
  }

  // ─── Mouse drag = pan via translate (no scroll involved) ───
  canvasWrap.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    // Don't start pan from a UI element that should handle its own clicks
    if (e.target.closest('.note, .note-close, .zoom-controls, .legend')) return;

    panState = {
      startX: e.clientX,
      startY: e.clientY,
      startPanX: state.pan.x,
      startPanY: state.pan.y
    };
    didDrag = false;
  });

  document.addEventListener('mousemove', (e) => {
    if (!panState) return;
    const dx = e.clientX - panState.startX;
    const dy = e.clientY - panState.startY;
    if (!didDrag && (Math.abs(dx) > PAN_THRESHOLD || Math.abs(dy) > PAN_THRESHOLD)) {
      didDrag = true;
      canvasWrap.classList.add('panning');
      if (state.openNote) closeNote();
    }
    if (didDrag) {
      setPan(panState.startPanX + dx, panState.startPanY + dy, false);
      e.preventDefault();
    }
  });

  document.addEventListener('mouseup', () => {
    if (!panState) return;
    canvasWrap.classList.remove('panning');
    panState = null;
  });

  document.addEventListener('mouseleave', () => {
    if (panState) {
      canvasWrap.classList.remove('panning');
      panState = null;
    }
  });

  // ─── Wire up zoom buttons ───
  document.getElementById('zoom-in').addEventListener('click', zoomIn);
  document.getElementById('zoom-out').addEventListener('click', zoomOut);
  document.getElementById('zoom-reset').addEventListener('click', zoomReset);
  document.getElementById('zoom-fit').addEventListener('click', fitToScreen);

  // ─── Wheel: pan with two-finger swipe; Cmd/Ctrl+wheel = zoom ───
  canvasWrap.addEventListener('wheel', (e) => {
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      const delta = -Math.sign(e.deltaY) * ZOOM_STEP;
      setZoom(state.zoom + delta, false);
    } else {
      // Trackpad two-finger pan: deltaX and deltaY drive translate
      setPan(state.pan.x - e.deltaX, state.pan.y - e.deltaY, false);
    }
  }, { passive: false });

  // ─── Redraw lines on resize ───
  window.addEventListener('resize', () => {
    drawLines();
    if (state.openNote) {
      const nodeEl = canvas.querySelector(`.mm-node[data-id="${state.openNote}"]`);
      if (nodeEl) positionNote(nodeEl);
    }
  });

  // ═══════════════ INIT ═══════════════
  render();
</script>

</body>
</html>
